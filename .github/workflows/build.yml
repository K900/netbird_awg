name: NetBird AWG Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      base_tag:
        description: Base tag (e.g. v0.66.0)
        required: false
        default: ""
        type: string
      release_mode:
        description: Use release build mode instead of snapshot
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build_linux:
    runs-on: ubuntu-latest
    env:
      WORKDIR: ${{ github.workspace }}/workdir
      BASE_TAG: ${{ inputs.base_tag || '' }}
      RELEASE_MODE: ${{ inputs.release_mode && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve vars
        run: |
          ./scripts/version_vars.sh --github-env >> "$GITHUB_ENV"
          ./scripts/version_vars.sh --print

      - name: Clone sources
        run: ./scripts/clone_sources.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/workdir/repos/netbird/go.mod
          cache: true
          cache-dependency-path: |
            ${{ github.workspace }}/workdir/repos/netbird/go.mod
            ${{ github.workspace }}/workdir/repos/netbird/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11

      # wails3 CLI links against GTK4 / WebKitGTK 6.0 via its internal/operatingsystem
      # package, so the dev libraries must be present before `go install`.
      - name: Install Wails Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Prepare sources
        run: ./scripts/prepare_sources.sh

      - name: Prepare release tag in source tree
        if: ${{ env.RELEASE_MODE == 'true' }}
        run: ./scripts/prepare_netbird_release_git.sh

      - name: Install wails3 CLI
        # Version derived from go.mod so the binding generator always matches
        # the wails runtime the daemon links against.
        working-directory: ${{ github.workspace }}/workdir/repos/netbird
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Install UI dependencies
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Wails bindings
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm run bindings

      - name: Build UI
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm build

      - name: Build (release local)
        if: ${{ env.RELEASE_MODE == 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ github.workspace }}/workdir/repos/netbird
          args: release --clean --config .goreleaser.awg.yaml --skip=publish --skip=validate --skip=nfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (snapshot)
        if: ${{ env.RELEASE_MODE != 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ github.workspace }}/workdir/repos/netbird
          args: release --clean --snapshot --config .goreleaser.awg.yaml --skip=nfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux packages (.deb/.rpm/.archlinux)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ github.workspace }}/workdir/repos/netbird
          args: release --clean --snapshot --config .goreleaser.awg.nfpm.yaml --skip=archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/workdir/repos/netbird/dist/netbird_*_linux_amd64*
            ${{ github.workspace }}/workdir/repos/netbird/dist/netbird_*_linux_arm64*
            ${{ github.workspace }}/workdir/repos/netbird/dist-nfpm/*.deb
            ${{ github.workspace }}/workdir/repos/netbird/dist-nfpm/*.rpm
            ${{ github.workspace }}/workdir/repos/netbird/dist-nfpm/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  build_android:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.release_mode && 'awg-release' || 'ci' }}
    env:
      WORKDIR: ${{ github.workspace }}/workdir
      BASE_TAG: ${{ inputs.base_tag || '' }}
      RELEASE_MODE: ${{ inputs.release_mode && 'true' || 'false' }}
      INCLUDE_ANDROID: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve vars
        run: |
          ./scripts/version_vars.sh --github-env >> "$GITHUB_ENV"
          ./scripts/version_vars.sh --print

      - name: Clone sources
        run: ./scripts/clone_sources.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/workdir/repos/netbird/go.mod
          cache: true
          cache-dependency-path: |
            ${{ github.workspace }}/workdir/repos/netbird/go.mod
            ${{ github.workspace }}/workdir/repos/netbird/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"
          cache: "gradle"

      - name: Setup NDK
        shell: bash
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620"

      - name: Set ANDROID_NDK_HOME
        shell: bash
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/23.1.7779620" >> $GITHUB_ENV

      - name: Install gomobile
        shell: bash
        run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20251113184115-a159579294ab

      - name: Prepare sources
        run: ./scripts/prepare_sources.sh

      - name: Build Android Go library
        shell: bash
        run: |
          cd workdir/repos/android
          PATH=$PATH:$(go env GOPATH)/bin bash -x build-android-lib.sh ${NETBIRD_RELEASE_TAG}

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "[error] ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/android-signing"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-signing/netbird-awg-release.p12"
          echo "NETBIRD_UPLOAD_STORE_FILE=${RUNNER_TEMP}/android-signing/netbird-awg-release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        env:
          NETBIRD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NETBIRD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NETBIRD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${NETBIRD_UPLOAD_STORE_PASSWORD}" || -z "${NETBIRD_UPLOAD_KEY_ALIAS}" || -z "${NETBIRD_UPLOAD_KEY_PASSWORD}" ]]; then
            echo "[error] Android signing secrets are not fully set" >&2
            exit 1
          fi
          cd workdir/repos/android
          ./gradlew --no-daemon assembleRelease -PversionName="${NETBIRD_RELEASE_TAG}" -PversionCode="${{ github.run_number }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/workdir/repos/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 7

  build_windows:
    runs-on: windows-latest
    env:
      WORKDIR: ${{ github.workspace }}/workdir
      BASE_TAG: ${{ inputs.base_tag || '' }}
      PRODUCT_NAME: NetBird AWG
      COPYRIGHT: "NetBird GmbH, NetBird AWG contributors"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git -C "$GITHUB_WORKSPACE" config core.autocrlf false
          git -C "$GITHUB_WORKSPACE" reset --hard HEAD
          git -C "$GITHUB_WORKSPACE" clean -fd

      - name: Resolve vars
        shell: bash
        run: |
          ./scripts/version_vars.sh --github-env >> "$GITHUB_ENV"
          ./scripts/version_vars.sh --print

      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: ${{ env.NETBIRD_RELEASE_TAG }}

      - name: Clone sources
        shell: bash
        run: ./scripts/clone_sources.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/workdir/repos/netbird/go.mod
          cache: true
          cache-dependency-path: |
            ${{ github.workspace }}/workdir/repos/netbird/go.mod
            ${{ github.workspace }}/workdir/repos/netbird/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@233067e

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11

      - name: Prepare sources
        shell: bash
        run: ./scripts/prepare_sources.sh

      - name: Install wails3 CLI
        # Version derived from go.mod so the binding generator always matches
        # the wails runtime the daemon links against.
        working-directory: ${{ github.workspace }}/workdir/repos/netbird
        shell: bash
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Stage WebView2 bootstrapper for installers
        # Both client/installer.nsis and client/netbird.wxs reference
        # client/MicrosoftEdgeWebview2Setup.exe. wails3 writes it there.
        # The signing pipeline (netbirdio/sign-pipelines) does the same
        # step for release builds; this mirrors it for PR sanity testing.
        shell: bash
        working-directory: ${{ github.workspace }}/workdir/repos/netbird
        run: wails3 generate webview2bootstrapper -dir client

      - name: Install UI dependencies
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Wails bindings
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm run bindings

      - name: Build UI
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm build

      - name: Generate Windows assets
        working-directory: ${{ github.workspace }}/workdir/repos/netbird
        run: |
          goversioninfo -64 -icon client/ui/build/windows/icon.ico -manifest client/manifest.xml -product-name "${{ env.PRODUCT_NAME }}" -copyright "${{ env.COPYRIGHT }}" -ver-major ${{ steps.semver_parser.outputs.major }} -ver-minor ${{ steps.semver_parser.outputs.minor }} -ver-patch ${{ steps.semver_parser.outputs.patch }} -ver-build 0 -file-version ${{ steps.semver_parser.outputs.fullversion }}.0 -product-version ${{ steps.semver_parser.outputs.fullversion }}.0 -o client/resources_windows_amd64.syso
          goversioninfo -64 -icon client/ui/build/windows/icon.ico -manifest client/manifest.xml -product-name "${{ env.PRODUCT_NAME }}-UI" -copyright "${{ env.COPYRIGHT }}" -ver-major ${{ steps.semver_parser.outputs.major }} -ver-minor ${{ steps.semver_parser.outputs.minor }} -ver-patch ${{ steps.semver_parser.outputs.patch }} -ver-build 0 -file-version ${{ steps.semver_parser.outputs.fullversion }}.0 -product-version ${{ steps.semver_parser.outputs.fullversion }}.0 -o client/ui/resources_windows_amd64.syso
      - name: Build Windows binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ github.workspace }}/workdir/repos/netbird
          args: build --clean --snapshot --config .goreleaser.awg.installers.yaml --id netbird-windows-amd64 --id netbird-ui-windows-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .exe
        shell: bash
        run: ./scripts/build_windows_installer.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/workdir/repos/netbird/dist/netbird_installer_*_windows_amd64.exe
          if-no-files-found: error
          retention-days: 7

  build_darwin:
    runs-on: macos-latest
    env:
      WORKDIR: ${{ github.workspace }}/workdir
      BASE_TAG: ${{ inputs.base_tag || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve vars
        run: |
          ./scripts/version_vars.sh --github-env >> "$GITHUB_ENV"
          ./scripts/version_vars.sh --print

      - name: Clone sources
        run: ./scripts/clone_sources.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/workdir/repos/netbird/go.mod
          cache: true
          cache-dependency-path: |
            ${{ github.workspace }}/workdir/repos/netbird/go.mod
            ${{ github.workspace }}/workdir/repos/netbird/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11

      - name: Prepare sources
        run: ./scripts/prepare_sources.sh

      - name: Install wails3 CLI
        # Version derived from go.mod so the binding generator always matches
        # the wails runtime the daemon links against.
        working-directory: ${{ github.workspace }}/workdir/repos/netbird
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Install UI dependencies
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Wails bindings
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm run bindings

      - name: Build UI
        working-directory: ${{ github.workspace }}/workdir/repos/netbird/client/ui/frontend
        run: pnpm build

      - name: Build darwin binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ github.workspace }}/workdir/repos/netbird
          args: build --clean --snapshot --config .goreleaser.awg.installers.yaml --id netbird-darwin --id netbird-ui-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .pkg
        run: ./scripts/build_darwin_pkg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-darwin-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/workdir/repos/netbird/dist/netbird_*_darwin_amd64.pkg
            ${{ github.workspace }}/workdir/repos/netbird/dist/netbird_*_darwin_arm64.pkg
          if-no-files-found: error
          retention-days: 7
